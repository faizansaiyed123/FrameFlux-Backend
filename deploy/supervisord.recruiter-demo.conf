[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
loglevel=info

[program:api]
directory=/app
command=/bin/sh -c 'exec uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port "${PORT:-8000}"'
autostart=true
autorestart=true
startsecs=3
startretries=10
priority=10
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:worker]
directory=/app
command=/bin/sh -c 'exec uv run --no-sync arq app.infrastructure.worker.WorkerSettings'
autostart=true
autorestart=true
startsecs=3
startretries=10
priority=20
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
