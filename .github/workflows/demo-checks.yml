name: FrameFlux demo backend checks

on:
  push:
    branches: [demo]
  pull_request:
    branches: [demo]

jobs:
  test-demo-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install demo runtime dependencies
        run: python -m pip install --upgrade pip && pip install fastapi "uvicorn[standard]" "httpx>=0.28.1" pytest pydantic python-multipart
      - name: Run standalone demo tests
        run: pytest -q demo_tests/test_demo_api.py
